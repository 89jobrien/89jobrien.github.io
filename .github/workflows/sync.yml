name: Sync showcase

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: 89jobrien/bazaar
          path: _bazaar

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            _bazaar/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('_bazaar/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Use committed insights.yaml
        # insights.yaml is generated offline (see scripts/synthesize_insights.py
        # for the manual regen path, which needs ANTHROPIC_API_KEY and the
        # private data/*.txt files) and committed here so the automated sync
        # doesn't depend on a live API call or account billing status.
        run: |
          mkdir -p _bazaar/examples
          cp insights.yaml _bazaar/examples/insights.yaml

      - name: Build bazaar-gen
        run: cargo build --release -p bazaar-gen
        working-directory: _bazaar

      - name: Run generator
        run: ../target/release/bz --output-dir $GITHUB_WORKSPACE --insights examples/insights.yaml
        working-directory: _bazaar
        env:
          BAZAAR_GITHUB_USER: ${{ secrets.BAZAAR_GITHUB_USER }}
          BAZAAR_CRATES_IO_USER: ${{ secrets.BAZAAR_CRATES_IO_USER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: sync showcase from bazaar"
            git push
          fi
